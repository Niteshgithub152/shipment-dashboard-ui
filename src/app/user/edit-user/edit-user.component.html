<mat-card class="mx-auto p-4 w-6/12">
  <div class="container">
    <div class="flex items-center text-2xl font-light mb-3 text-black-700">
      <a matButton class="backBtn" [routerLink]="['/user']">
        <mat-icon>arrow_back</mat-icon>
      </a>
      <div class="">
        Edit User - {{userId}}
      </div>
    </div>

    <form [formGroup]="editUserForm" (ngSubmit)="onSubmit()">
      <mat-form-field appearance="fill">
        <mat-label>User Id</mat-label>
        <input matInput formControlName="userId" required />
      </mat-form-field>

      <mat-form-field appearance="fill">
        <mat-label>User Name</mat-label>
        <input matInput formControlName="userName" required />
      </mat-form-field>

      <mat-form-field appearance="fill">
        <mat-label>Email</mat-label>
        <input matInput formControlName="email" required />
      </mat-form-field>

      <mat-form-field appearance="fill">
        <mat-label>Password</mat-label>
        <input matInput formControlName="password" type="password" required />
      </mat-form-field>

      <mat-form-field appearance="fill">
        <mat-label>Role</mat-label>
        <mat-select formControlName="roleCategory" required>
          <mat-option value="admin">Admin</mat-option>
          <mat-option value="driver">Driver</mat-option>
          <mat-option value="customer">Customer</mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="fill">
        <mat-label>ContactNo</mat-label>
        <input matInput formControlName="contactNumber" required />
       
      </mat-form-field>

      <div class="flex justify-center">
        <button
          type="submit"
          class="bg-blue-600 rounded-sm shadow-md w-full text-white! p-2"
          [disabled]="editUserForm.invalid">
          Update User
        </button>
      </div>
    </form>
  </div>
</mat-card>
